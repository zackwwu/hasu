# Maestro flow: Phase 9 — Compute Pipeline Verification
#
# Tests the reactive chain: tab switching, preview rotation, cut list refresh.
# Run: maestro test .maestro/phase-9-pipeline.yaml -p ios

appId: zackwwu.hasu.TileLayout
---
- launchApp:
    clearState: false

# ── Open existing project ──
- assertVisible: "Projects"
- tapOn: "Maestro Test"
- tapOn: "Bathroom"

# ── Layout tab ──
- tapOn: "Layout"
- takeScreenshot: pipeline-01-layout

# ── Preview tab: rotation ──
- tapOn: "Preview"
- takeScreenshot: pipeline-02-preview

- tapOn:
    id: "rotate-right"
- takeScreenshot: pipeline-03-rotated-90

- tapOn:
    id: "rotate-right"
- takeScreenshot: pipeline-04-rotated-180

- tapOn:
    id: "rotate-left"
- tapOn:
    id: "rotate-left"
- takeScreenshot: pipeline-05-rotated-back

# ── Top-down toggle ──
- tapOn: "Top-Down"
- takeScreenshot: pipeline-06-topdown

# ── Cut List tab ──
- tapOn: "Cut List"
- takeScreenshot: pipeline-07-cutlist

# ── Back to Surfaces ──
- tapOn: "Surfaces"
- takeScreenshot: pipeline-08-surfaces
