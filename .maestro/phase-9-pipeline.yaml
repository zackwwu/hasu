# Maestro flow: Phase 9 — Compute Pipeline Verification
#
# Tests the reactive chain: tab switching, preview rotation, cut list refresh.
#
# iOS:      maestro test .maestro/phase-9-pipeline.yaml -p ios -e APP_ID=zackwwu.hasu.TileLayout
# Android:  maestro test .maestro/phase-9-pipeline.yaml -p android -e APP_ID=com.hasu.tilelayout

appId: ${APP_ID}
---
- launchApp:
    clearState: false

# ── Open existing project ──
- assertVisible: "Projects"
- tapOn: "Maestro Test"
- tapOn: "Bathroom"

# ── Layout tab ──
- tapOn: "Layout"
- takeScreenshot: pipeline-01-layout

# ── Preview tab: rotation ──
- tapOn: "Preview"
- takeScreenshot: pipeline-02-preview

- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "rotate-right"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "▶"
- takeScreenshot: pipeline-03-rotated-90

- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "rotate-right"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "▶"
- takeScreenshot: pipeline-04-rotated-180

- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "rotate-left"
      - tapOn:
          id: "rotate-left"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "◀"
      - tapOn: "◀"
- takeScreenshot: pipeline-05-rotated-back

# ── Top-down toggle ──
- tapOn: "Top-Down"
- takeScreenshot: pipeline-06-topdown

# ── Cut List tab ──
- tapOn: "Cut List"
- takeScreenshot: pipeline-07-cutlist

# ── Back to Surfaces ──
- tapOn: "Surfaces"
- takeScreenshot: pipeline-08-surfaces
