# Maestro flow: Phase 9 — Compute Pipeline Verification
#
# Tests the reactive chain: tab switching, 3D preview camera + wall visibility, cut list refresh.
#
# iOS:      maestro test .maestro/phase-9-pipeline.yaml -p ios -e APP_ID=zackwwu.hasu.TileLayout
# Android:  maestro test .maestro/phase-9-pipeline.yaml -p android -e APP_ID=com.hasu.tilelayout

appId: ${APP_ID}
---
- launchApp:
    clearState: false

# ── Open existing project ──
- assertVisible: "Projects"
- tapOn: "Maestro Test"
- tapOn: "Bathroom"

# ── Layout tab ──
- tapOn: "Layout"
- takeScreenshot: pipeline-01-layout

# ── Preview tab: 3D orbit, top view, wall visibility ──
- tapOn: "Preview"
- takeScreenshot: pipeline-02-preview

# Drag orbits the camera (same gesture on both platforms)
- swipe:
    start: "70%, 35%"
    end: "30%, 35%"
    duration: 600
- takeScreenshot: pipeline-03-orbited

- swipe:
    start: "50%, 25%"
    end: "50%, 45%"
    duration: 600
- takeScreenshot: pipeline-04-orbited-pitch

- tapOn: "Top"
- takeScreenshot: pipeline-05-topdown
- tapOn: "Reset view"

# Hide the first wall via its chip, then bring every wall back
- tapOn:
    text: ".*Wall"
    index: 0
- takeScreenshot: pipeline-06-wall-hidden
- tapOn: "Show all walls"
- takeScreenshot: pipeline-07-walls-restored

# ── Cut List tab ──
- tapOn: "Cut List"
- takeScreenshot: pipeline-08-cutlist

# ── Back to Surfaces ──
- tapOn: "Surfaces"
- takeScreenshot: pipeline-09-surfaces
