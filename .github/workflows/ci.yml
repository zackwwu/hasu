name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel an in-progress run when a newer commit lands on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  ios:
    name: iOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          fi
          xcodebuild -version
          xcode-select -p

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      # Standard macos-15 runners have 7 GB RAM. gradle.properties asks for a
      # 4 GB Gradle heap and a 3 GB Kotlin daemon, which the kernel will kill.
      - name: Fit Gradle memory to the runner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("gradle.properties")
          text = path.read_text()
          replacements = {
              "kotlin.daemon.jvmargs=-Xmx3072M": "kotlin.daemon.jvmargs=-Xmx1024m",
              "org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8": (
                  "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
              ),
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"gradle.properties is missing expected setting: {old}")
              text = text.replace(old, new, 1)
          extra = []
          if "kotlin.native.jvmArgs" not in text:
              extra.append("kotlin.native.jvmArgs=-Xmx1280m")
          if "org.gradle.workers.max" not in text:
              extra.append("org.gradle.workers.max=2")
          if extra:
              text = text.rstrip() + "\n" + "\n".join(extra) + "\n"
          path.write_text(text)
          PY

      - name: Ensure Android SDK platform 36
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is not set; the shared Android target cannot be configured" >&2
            exit 1
          fi
          echo "ANDROID_HOME=${ANDROID_HOME}"
          if [ -d "${ANDROID_HOME}/platforms/android-36" ]; then
            echo "platforms;android-36 already installed"
            exit 0
          fi
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER=(sdkmanager)
          elif [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER=("${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager")
          else
            echo "android-36 is missing and sdkmanager was not found" >&2
            exit 1
          fi
          yes | "${SDKMANAGER[@]}" --licenses >/dev/null || true
          "${SDKMANAGER[@]}" "platforms;android-36" "build-tools;36.0.0"

      - name: Build SharedLogic iOS Simulator framework
        run: ./gradlew :sharedLogic:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      # No XCTest target is checked in. This build is the compile check for the Swift app.
      - name: Build iOS app for the simulator
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            'CODE_SIGN_IDENTITY=-' \
            'DEVELOPMENT_TEAM=' \
            build

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Android SDK platform 36
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is not set" >&2
            exit 1
          fi
          echo "ANDROID_HOME=${ANDROID_HOME}"
          if [ -d "${ANDROID_HOME}/platforms/android-36" ]; then
            echo "platforms;android-36 already installed"
            exit 0
          fi
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER=(sdkmanager)
          elif [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER=("${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager")
          else
            echo "android-36 is missing and sdkmanager was not found" >&2
            exit 1
          fi
          yes | "${SDKMANAGER[@]}" --licenses >/dev/null || true
          "${SDKMANAGER[@]}" "platforms;android-36" "build-tools;36.0.0"

      - name: Shared JVM and Android host tests
        run: ./gradlew :sharedLogic:jvmTest :sharedLogic:testAndroidHostTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Lint debug
        run: ./gradlew :androidApp:lintDebug --stacktrace
